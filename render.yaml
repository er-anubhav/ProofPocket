services:
  - type: web
    name: proofpocket-api
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BHARATCODE_API_KEY
        sync: false
      - key: BHARATCODE_BASE_URL
        value: https://bharatcode.ai/api/model/v1
      - key: BHARATCODE_MODEL
        value: qwen-3.8-27b
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
